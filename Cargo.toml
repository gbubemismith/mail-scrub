[package]
name = "mail-scrub"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "sync"] }
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "mailscrub"
path = "src/main.rs"
