[package]
name = "mail-scrub"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
getrandom = "0.4.3"
keyring = "4.2.0"
open = "5.4.4"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query", "rustls"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "1.1.8"
toml_edit = "0.25.17"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"

[[bin]]
name = "mailscrub"
path = "src/main.rs"
